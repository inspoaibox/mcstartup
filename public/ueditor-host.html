<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UEditor Host</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #editor-container {
        width: 100%;
        height: 100%;
      }
      /* 覆盖 UEditor 默认样式，让编辑器撑满容器 */
      .edui-editor {
        width: 100% !important;
      }
      .edui-editor-iframeholder {
        flex: 1 !important;
      }
    </style>
  </head>
  <body>
    <div id="editor-container">
      <script id="ueditor" type="text/plain"></script>
    </div>

    <script src="UEditorPlus/ueditor.config.js"></script>
    <script src="UEditorPlus/ueditor.all.js"></script>
    <script>
      var ue;
      var pendingContent = null;
      var isReady = false;

      function initEditor(theme) {
        var isDark = theme === 'dark';

        ue = UE.getEditor('ueditor', {
          UEDITOR_HOME_URL: 'UEditorPlus/',
          // 禁用服务端上传（本地工具，无后端）
          serverUrl: '',
          // 工具栏完整配置（全功能）
          toolbars: [
            [
              'fullscreen',
              'source',
              '|',
              'undo',
              'redo',
              '|',
              'bold',
              'italic',
              'underline',
              'fontborder',
              'strikethrough',
              'superscript',
              'subscript',
              'removeformat',
              'formatmatch',
              'autotypeset',
              'blockquote',
              'pasteplain',
              '|',
              'forecolor',
              'backcolor',
              'insertorderedlist',
              'insertunorderedlist',
              'selectall',
              'cleardoc',
              '|',
              'rowspacingtop',
              'rowspacingbottom',
              'lineheight',
              '|',
              'customstyle',
              'paragraph',
              'fontfamily',
              'fontsize',
              '|',
              'directionalityltr',
              'directionalityrtl',
              'indent',
              '|',
              'justifyleft',
              'justifycenter',
              'justifyright',
              'justifyjustify',
              '|',
              'touppercase',
              'tolowercase',
              '|',
              'link',
              'unlink',
              'anchor',
              '|',
              'imagenone',
              'imageleft',
              'imageright',
              'imagecenter',
              '|',
              'simpleupload',
              'insertimage',
              'emotion',
              'scrawl',
              'insertvideo',
              'music',
              'attachment',
              'map',
              'gmap',
              'insertframe',
              'insertcode',
              'webapp',
              'pagebreak',
              'template',
              'background',
              '|',
              'horizontal',
              'date',
              'time',
              'spechars',
              'snapscreen',
              'wordimage',
              '|',
              'inserttable',
              'deletetable',
              'insertparagraphbeforetable',
              'insertrow',
              'deleterow',
              'insertcol',
              'deletecol',
              'mergecells',
              'mergeright',
              'mergedown',
              'splittocells',
              'splittorows',
              'splittocols',
              'charts',
              '|',
              'print',
              'preview',
              'searchreplace',
              'drafts',
              'help',
            ],
          ],
          initialFrameWidth: '100%',
          initialFrameHeight: 400,
          autoHeightEnabled: false,
          autoFloatEnabled: true,
          // 图片上传：禁用（本地工具）
          imageActionName: '',
          // 允许所有标签
          allowDivTransToP: false,
          retainOnlyLabelPasted: false,
          // 主题
          theme: isDark ? 'dark' : 'default',
        });

        ue.ready(function () {
          isReady = true;

          // 如果有待设置的内容
          if (pendingContent !== null) {
            ue.setContent(pendingContent);
            pendingContent = null;
          }

          // 通知父窗口编辑器已就绪
          window.parent.postMessage({ type: 'ueditor-ready' }, '*');

          // 监听内容变化
          ue.addListener('contentChange', function () {
            var content = ue.getContent();
            window.parent.postMessage({ type: 'ueditor-change', content: content }, '*');
          });
        });
      }

      // 监听来自父窗口的消息
      window.addEventListener('message', function (e) {
        var data = e.data;
        if (!data || !data.type) return;

        switch (data.type) {
          case 'ueditor-init':
            initEditor(data.theme || 'light');
            break;

          case 'ueditor-set-content':
            if (isReady && ue) {
              ue.setContent(data.content || '');
            } else {
              pendingContent = data.content || '';
            }
            break;

          case 'ueditor-get-content':
            if (isReady && ue) {
              var html = ue.getContent();
              var text = ue.getContentTxt();
              window.parent.postMessage(
                {
                  type: 'ueditor-content',
                  content: html,
                  text: text,
                  requestId: data.requestId,
                },
                '*'
              );
            }
            break;

          case 'ueditor-get-html':
            if (isReady && ue) {
              window.parent.postMessage(
                {
                  type: 'ueditor-html',
                  content: ue.getContent(),
                  requestId: data.requestId,
                },
                '*'
              );
            }
            break;

          case 'ueditor-clear':
            if (isReady && ue) {
              ue.setContent('');
            }
            break;

          case 'ueditor-set-theme':
            // UEditor Plus 支持动态切换主题
            if (isReady && ue) {
              // 重新初始化（主题切换需要重建）
              var currentContent = ue.getContent();
              ue.destroy();
              isReady = false;
              pendingContent = currentContent;
              initEditor(data.theme);
            }
            break;
        }
      });

      // 页面加载完成后通知父窗口可以初始化了
      window.addEventListener('load', function () {
        window.parent.postMessage({ type: 'ueditor-host-ready' }, '*');
      });
    </script>
  </body>
</html>
